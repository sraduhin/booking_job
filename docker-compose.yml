services:
  db:
    image: postgres:16
    container_name: booking_db
    environment:
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
      POSTGRES_DB: booking
    ports:
      - "25432:5432"
    volumes:
      - ../.db_data/bookings/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d booking"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      args:
        REQUIREMENTS_FILE: requirements-dev.txt
    container_name: booking_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://booking:booking@db:5432/booking
      DEBUG: ${DEBUG:-false}
      DEBUG_HOST: ${DEBUG_HOST:-host.docker.internal}
      DEBUG_PORT: ${DEBUG_PORT:-5678}
    volumes:
      - ./app:/app/app
      - ./scripts:/app/scripts
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini:ro
      - ./database.ddl:/app/database.ddl:ro
      - ./seed.sql:/app/seed.sql:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
      ]
